name: Lighthouse

on:
  push:
    branches: [main, redesign]
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Lighthouse (mobile, three runs per page)
        run: npx --yes @lhci/cli@0.15.1 autorun
